name: "Data Pipeline Infrastructure Deploy/Destroy"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acao Terraform a ser executada"
        required: true
        type: choice
        options:
          - "apply"
          - "destroy"
      reset_state:
        description: "Descartar state previo e recriar do zero (util se trocou de conta AWS / Learner Lab)"
        required: false
        type: boolean
        default: false
      aws_access_key_id:
        description: "AWS Access Key ID (Sessao temporaria do Learner Lab)"
        required: true
        type: string
      aws_secret_access_key:
        description: "AWS Secret Access Key"
        required: true
        type: string
      aws_session_token:
        description: "AWS Session Token"
        required: true
        type: string

jobs:
  terraform-data:
    name: "Executar Terraform Pipeline de Dados (${{ inputs.action }})"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositorio Infraestrutura
        uses: actions/checkout@v4

      - name: Checkout do Modulo Data-Pipeline
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Data-Pipeline'
          ref: 'main'
          path: 'Data-Pipeline'

      - name: Configurar estrutura de pastas multi-repo
        run: |
          mkdir -p ../../../Data-Pipeline
          cp -r Data-Pipeline/* ../../../Data-Pipeline/ 2>/dev/null || true
          mkdir -p ../../Data-Pipeline
          cp -r Data-Pipeline/* ../../Data-Pipeline/ 2>/dev/null || true
          mkdir -p ../Data-Pipeline
          cp -r Data-Pipeline/* ../Data-Pipeline/ 2>/dev/null || true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Autenticar na AWS (Credenciais Efemeras do Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: "us-east-1"

      - name: Restaurar Terraform State (Persistência por Conta AWS)
        run: |
          CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          echo "Conta AWS autenticada: $CURRENT_ACCOUNT"

          if [ "${{ inputs.reset_state }}" = "true" ]; then
            echo "Opcao reset_state ativada. Descartando state prévio para data."
            rm -f ./environments/data/terraform.tfstate*
            exit 0
          fi

          mkdir -p /tmp/tfstate-repo
          git clone --depth 1 -b terraform-states https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/tfstate-repo 2>/dev/null || true
          
          ACCOUNT_STATE_FILE="/tmp/tfstate-repo/environments/data/${CURRENT_ACCOUNT}/terraform.tfstate"
          LEGACY_STATE_FILE="/tmp/tfstate-repo/environments/data/terraform.tfstate"

          if [ -n "$CURRENT_ACCOUNT" ] && [ -f "$ACCOUNT_STATE_FILE" ]; then
            echo "Encontrado estado isolado para a conta $CURRENT_ACCOUNT em data. Restaurando..."
            cp /tmp/tfstate-repo/environments/data/${CURRENT_ACCOUNT}/terraform.tfstate* ./environments/data/
          elif [ -f "$LEGACY_STATE_FILE" ]; then
            STATE_ACCOUNTS=$(grep -o -E 'arn:aws:[^:]+:[^:]+:([0-9]{12})' "$LEGACY_STATE_FILE" 2>/dev/null | awk -F: '{print $5}' | sort -u | grep -v '^$' || true)
            MATCH=true
            if [ -n "$CURRENT_ACCOUNT" ] && [ -n "$STATE_ACCOUNTS" ]; then
              for ACC in $STATE_ACCOUNTS; do
                if [ "$ACC" != "$CURRENT_ACCOUNT" ]; then
                  MATCH=false
                  break
                fi
              done
            fi

            if [ "$MATCH" = "true" ]; then
              echo "Encontrado estado prévio compatível com a conta $CURRENT_ACCOUNT. Restaurando..."
              cp /tmp/tfstate-repo/environments/data/terraform.tfstate* ./environments/data/
            else
              echo "::warning:: O estado legado na raiz pertence a outra conta ($STATE_ACCOUNTS). Iniciando com state novo para a conta $CURRENT_ACCOUNT sem sobrescrever a conta anterior."
            fi
          else
            echo "Nenhum arquivo terraform.tfstate prévio encontrado para a conta $CURRENT_ACCOUNT em data."
          fi

      - name: Terraform Init
        working-directory: ./environments/data
        run: terraform init

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./environments/data
        run: terraform apply -auto-approve

      - name: Pré-Destroy - Esvaziar Buckets S3 da Pipeline de Dados
        if: ${{ inputs.action == 'destroy' }}
        run: |
          echo "=== Preparando buckets para Destroy Limpo ==="
          CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")

          echo "Esvaziando buckets S3 da pipeline de dados na conta $CURRENT_ACCOUNT..."
          BUCKETS=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'lumina-sptech')].Name" --output text 2>/dev/null || true)
          for B in $BUCKETS; do
            if [ -n "$B" ] && [ "$B" != "None" ]; then
              echo "Esvaziando bucket s3://$B..."
              aws s3 rm "s3://$B" --recursive 2>/dev/null || true
            fi
          done

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ./environments/data
        run: terraform destroy -auto-approve || true

      - name: Pós-Destroy - Limpeza Garantida de Recursos Órfãos do Data Pipeline
        if: ${{ inputs.action == 'destroy' }}
        run: |
          echo "=== Verificando e limpando recursos órfãos residuais da Data Pipeline ==="

          # 1. Dropar banco de dados Athena lumina_logs_db se ainda existir
          if aws glue get-database --name lumina_logs_db >/dev/null 2>&1; then
            echo "Removendo banco de dados Athena/Glue residual lumina_logs_db..."
            aws glue delete-database --name lumina_logs_db 2>/dev/null || true
          fi

          # 2. Deletar Glue Job residual se ainda existir
          if aws glue get-job --job-name lumina-bronze-to-silver-data >/dev/null 2>&1; then
            echo "Removendo Glue Job residual lumina-bronze-to-silver-data..."
            aws glue delete-job --job-name lumina-bronze-to-silver-data 2>/dev/null || true
          fi

          # 3. Deletar Lambda de extração residual
          if aws lambda get-function --function-name lumina-extracao-sisagua-data >/dev/null 2>&1; then
            echo "Removendo Lambda residual lumina-extracao-sisagua-data..."
            aws lambda delete-function --function-name lumina-extracao-sisagua-data 2>/dev/null || true
          fi

          # 4. Deletar stacks CloudFormation S3 residuais
          CF_STACKS=$(aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE DELETE_FAILED --query "StackSummaries[?starts_with(StackName, 'cf-s3-lumina-sptech')].StackName" --output text 2>/dev/null || true)
          for S in $CF_STACKS; do
            if [ -n "$S" ] && [ "$S" != "None" ]; then
              echo "Deletando stack CloudFormation S3: $S..."
              aws cloudformation delete-stack --stack-name "$S" 2>/dev/null || true
            fi
          done

      - name: Persistir Terraform State (Branch terraform-states)
        if: always()
        run: |
          CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          if [ -f "./environments/data/terraform.tfstate" ]; then
            echo "Persistindo estado atualizado de data (Conta: $CURRENT_ACCOUNT) na branch terraform-states..."
            rm -rf /tmp/tfstate-repo
            git clone --depth 1 -b terraform-states https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/tfstate-repo 2>/dev/null || {
              mkdir -p /tmp/tfstate-repo
              cd /tmp/tfstate-repo
              git init
              git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git checkout -b terraform-states
            }
            cd /tmp/tfstate-repo

            # Salva na pasta da conta do usuário para isolamento multi-aluno
            if [ -n "$CURRENT_ACCOUNT" ]; then
              mkdir -p "environments/data/${CURRENT_ACCOUNT}"
              cp $GITHUB_WORKSPACE/environments/data/terraform.tfstate* "environments/data/${CURRENT_ACCOUNT}/"
            fi

            # Salva na raiz para manter compatibilidade
            mkdir -p environments/data
            cp $GITHUB_WORKSPACE/environments/data/terraform.tfstate* environments/data/

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add environments/data/
            git commit -m "chore(terraform): atualiza state de data [conta: ${CURRENT_ACCOUNT:-desconhecida}] [skip ci]" || echo "Nenhuma alteracao no state."
            git pull --rebase origin terraform-states 2>/dev/null || true
            git push origin terraform-states || git push -u origin terraform-states --force || echo "Aviso: Nao foi possivel persistir via git push."
          fi

      - name: Salvar State como Artefato do Workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-data
          path: ./environments/data/terraform.tfstate*
          retention-days: 7
