name: "Terraform Infrastructure Deploy/Destroy"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acao Terraform a ser executada"
        required: true
        type: choice
        options:
          - "apply"
          - "destroy"
      environment:
        description: "Perfil de Ambiente"
        required: true
        type: choice
        options:
          - "dev"
          - "prod"
      reset_state:
        description: "Descartar state previo e recriar do zero (util se trocou de conta AWS / Learner Lab)"
        required: false
        type: boolean
        default: false
      app_branch:
        description: "Branch das aplicacoes (Back-end, Front-End e Banco-de-dados)"
        required: true
        type: choice
        default: "develop"
        options:
          - "develop"
          - "main"
      aws_access_key_id:
        description: "AWS Access Key ID (Sessao temporaria do Learner Lab)"
        required: true
        type: string
      aws_secret_access_key:
        description: "AWS Secret Access Key"
        required: true
        type: string
      aws_session_token:
        description: "AWS Session Token"
        required: true
        type: string

jobs:
  terraform:
    name: "Executar Terraform (${{ inputs.action }} em ${{ inputs.environment }})"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      TF_VAR_alexa_lwa_client_id: ${{ secrets.ALEXA_LWA_CLIENT_ID }}
      TF_VAR_alexa_lwa_client_secret: ${{ secrets.ALEXA_LWA_CLIENT_SECRET }}
    steps:
      - name: Checkout do Repositorio Infraestrutura
        uses: actions/checkout@v4

      - name: Checkout do Modulo Lambda-Alexa
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Lambda-Alexa'
          ref: 'main'
          path: 'Lambda-Alexa'

      - name: Checkout do Modulo Data-Pipeline
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Data-Pipeline'
          ref: 'main'
          path: 'Data-Pipeline'

      - name: Checkout do Repositorio Back-end
        if: ${{ inputs.action == 'apply' }}
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Back-end'
          ref: ${{ inputs.app_branch }}
          path: 'Back-end'

      - name: Checkout do Repositorio Front-End
        if: ${{ inputs.action == 'apply' }}
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Front-End'
          ref: ${{ inputs.app_branch }}
          path: 'Front-End'

      - name: Checkout do Repositorio Banco-de-dados
        id: checkout-db
        if: ${{ inputs.action == 'apply' }}
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Banco-de-dados'
          ref: ${{ inputs.app_branch }}
          path: 'Banco-de-dados'
        continue-on-error: true

      - name: Fallback Checkout Banco-de-dados (se a branch selecionada nao existir no banco)
        if: ${{ inputs.action == 'apply' && steps.checkout-db.outcome != 'success' }}
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Banco-de-dados'
          ref: 'main'
          path: 'Banco-de-dados'

      - name: Configurar Node.js para Lambda-Alexa
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias do Lambda-Alexa (node_modules)
        working-directory: Lambda-Alexa
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Configurar Java 21 para compilação do Back-end
        if: ${{ inputs.action == 'apply' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configurar estrutura de pastas multi-repo
        run: |
          mkdir -p ../../../Lambda-Alexa
          cp -r Lambda-Alexa/* ../../../Lambda-Alexa/ 2>/dev/null || true
          mkdir -p ../../Lambda-Alexa
          cp -r Lambda-Alexa/* ../../Lambda-Alexa/ 2>/dev/null || true
          mkdir -p ../Lambda-Alexa
          cp -r Lambda-Alexa/* ../Lambda-Alexa/ 2>/dev/null || true
          mkdir -p ../../../Data-Pipeline
          cp -r Data-Pipeline/* ../../../Data-Pipeline/ 2>/dev/null || true
          mkdir -p ../../Data-Pipeline
          cp -r Data-Pipeline/* ../../Data-Pipeline/ 2>/dev/null || true
          mkdir -p ../Data-Pipeline
          cp -r Data-Pipeline/* ../Data-Pipeline/ 2>/dev/null || true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Autenticar na AWS (Credenciais Efemeras do Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: "us-east-1"

      - name: Restaurar Terraform State (Persistência por Conta AWS)
        run: |
          CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          echo "Conta AWS autenticada: $CURRENT_ACCOUNT"

          if [ "${{ inputs.reset_state }}" = "true" ]; then
            echo "Opcao reset_state ativada. Descartando state prévio para ${{ inputs.environment }}."
            rm -f ./environments/${{ inputs.environment }}/terraform.tfstate*
            exit 0
          fi

          mkdir -p /tmp/tfstate-repo
          git clone --depth 1 -b terraform-states https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/tfstate-repo 2>/dev/null || true
          
          ACCOUNT_STATE_FILE="/tmp/tfstate-repo/environments/${{ inputs.environment }}/${CURRENT_ACCOUNT}/terraform.tfstate"
          LEGACY_STATE_FILE="/tmp/tfstate-repo/environments/${{ inputs.environment }}/terraform.tfstate"

          if [ -n "$CURRENT_ACCOUNT" ] && [ -f "$ACCOUNT_STATE_FILE" ]; then
            echo "Encontrado estado isolado para a conta $CURRENT_ACCOUNT em ${{ inputs.environment }}. Restaurando..."
            cp /tmp/tfstate-repo/environments/${{ inputs.environment }}/${CURRENT_ACCOUNT}/terraform.tfstate* ./environments/${{ inputs.environment }}/
          elif [ -f "$LEGACY_STATE_FILE" ]; then
            STATE_ACCOUNTS=$(grep -o -E 'arn:aws:[^:]+:[^:]+:([0-9]{12})' "$LEGACY_STATE_FILE" 2>/dev/null | awk -F: '{print $5}' | sort -u | grep -v '^$' || true)
            MATCH=true
            if [ -n "$CURRENT_ACCOUNT" ] && [ -n "$STATE_ACCOUNTS" ]; then
              for ACC in $STATE_ACCOUNTS; do
                if [ "$ACC" != "$CURRENT_ACCOUNT" ]; then
                  MATCH=false
                  break
                fi
              done
            fi

            if [ "$MATCH" = "true" ]; then
              echo "Encontrado estado prévio compatível com a conta $CURRENT_ACCOUNT. Restaurando..."
              cp /tmp/tfstate-repo/environments/${{ inputs.environment }}/terraform.tfstate* ./environments/${{ inputs.environment }}/
            else
              echo "::warning:: O estado legado na raiz pertence a outra conta ($STATE_ACCOUNTS). Iniciando com state novo para a conta $CURRENT_ACCOUNT sem sobrescrever a conta anterior."
            fi
          else
            echo "Nenhum arquivo terraform.tfstate prévio encontrado para a conta $CURRENT_ACCOUNT em ${{ inputs.environment }}."
          fi

      - name: Terraform Init
        working-directory: ./environments/${{ inputs.environment }}
        run: terraform init

      - name: Limpar Stacks CloudFormation com Falha Prévia (ROLLBACK_COMPLETE)
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Verificando se existem stacks CloudFormation em ROLLBACK_COMPLETE..."
          FAILED_STACKS=$(aws cloudformation list-stacks --stack-status-filter ROLLBACK_COMPLETE --query "StackSummaries[].StackName" --output text 2>/dev/null || true)
          if [ -n "$FAILED_STACKS" ] && [ "$FAILED_STACKS" != "None" ]; then
            for STACK in $FAILED_STACKS; do
              echo "Deletando stack morta $STACK para permitir recriação limpa pelo Terraform..."
              aws cloudformation delete-stack --stack-name "$STACK"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK" 2>/dev/null || true
            done
          else
            echo "Nenhuma stack em ROLLBACK_COMPLETE encontrada."
          fi

      - name: Fase 1 - Terraform Apply ECR (Criação dos Repositórios ECR)
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./environments/${{ inputs.environment }}
        run: terraform apply -target=module.ecr -auto-approve

      - name: Autenticar no Amazon ECR
        if: ${{ inputs.action == 'apply' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fase 2 - Build e Push da Imagem Backend para o ECR
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Compilando backend Spring Boot (Maven)..."
          cd Back-end
          mvn clean package -DskipTests
          echo "Construindo imagem Docker backend..."
          docker build -t ${{ steps.login-ecr.outputs.registry }}/lumina-backend:latest .
          echo "Enviando imagem backend ao ECR..."
          docker push ${{ steps.login-ecr.outputs.registry }}/lumina-backend:latest
          cd ..

      - name: Fase 2 - Build e Push da Imagem Frontend para o ECR
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Compilando frontend React/Vite..."
          cd Front-End
          npm ci
          npm run build
          echo "Construindo imagem Docker frontend..."
          docker build -t ${{ steps.login-ecr.outputs.registry }}/lumina-frontend:latest .
          echo "Enviando imagem frontend ao ECR..."
          docker push ${{ steps.login-ecr.outputs.registry }}/lumina-frontend:latest
          cd ..

      - name: Fase 2 - Build e Push da Imagem Banco-de-dados para o ECR
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Construindo imagem Docker database..."
          cd Banco-de-dados
          docker build -t ${{ steps.login-ecr.outputs.registry }}/lumina-database:latest .
          echo "Enviando imagem database ao ECR..."
          docker push ${{ steps.login-ecr.outputs.registry }}/lumina-database:latest
          cd ..

      - name: Fase 2 - Tag e Push da Imagem RabbitMQ para o ECR
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Baixando imagem oficial do RabbitMQ 3.13 Management..."
          docker pull rabbitmq:3.13-management-alpine
          docker tag rabbitmq:3.13-management-alpine ${{ steps.login-ecr.outputs.registry }}/lumina-rabbitmq:latest
          echo "Enviando imagem RabbitMQ ao ECR..."
          docker push ${{ steps.login-ecr.outputs.registry }}/lumina-rabbitmq:latest

      - name: Fase 3 - Terraform Apply Completo (EC2s, ALBs, Storage e Telecom)
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./environments/${{ inputs.environment }}
        run: terraform apply -auto-approve

      - name: Pré-Destroy - Esvaziar Buckets S3 e Imagens ECR
        if: ${{ inputs.action == 'destroy' }}
        run: |
          echo "=== Preparando recursos para Destroy Limpo ==="
          CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")

          echo "Esvaziando buckets S3 da conta $CURRENT_ACCOUNT..."
          BUCKETS=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'lumina')].Name" --output text 2>/dev/null || true)
          for B in $BUCKETS; do
            if [ -n "$B" ] && [ "$B" != "None" ]; then
              echo "Esvaziando bucket s3://$B..."
              aws s3 rm "s3://$B" --recursive 2>/dev/null || true
            fi
          done

          echo "Esvaziando imagens de repositórios ECR..."
          REPOS=$(aws ecr describe-repositories --query "repositories[?contains(repositoryName, 'lumina')].repositoryName" --output text 2>/dev/null || true)
          for R in $REPOS; do
            if [ -n "$R" ] && [ "$R" != "None" ]; then
              IMAGES=$(aws ecr list-images --repository-name "$R" --query 'imageIds[*]' --output json 2>/dev/null || true)
              if [ -n "$IMAGES" ] && [ "$IMAGES" != "[]" ] && [ "$IMAGES" != "None" ]; then
                echo "Removendo imagens do repositório $R..."
                aws ecr batch-delete-image --repository-name "$R" --image-ids "$IMAGES" 2>/dev/null || true
              fi
            fi
          done

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ./environments/${{ inputs.environment }}
        run: terraform destroy -auto-approve || true

      - name: Pós-Destroy - Limpeza Garantida de Recursos Órfãos
        if: ${{ inputs.action == 'destroy' }}
        run: |
          echo "=== Verificando e limpando recursos órfãos residuais ==="

          # 1. Terminar instâncias EC2 residuais do projeto Lumina
          INSTANCES=$(aws ec2 describe-instances --filters "Name=tag:Project,Values=lumina" "Name=instance-state-name,Values=running,pending,stopped" --query "Reservations[].Instances[].InstanceId" --output text 2>/dev/null || true)
          if [ -n "$INSTANCES" ] && [ "$INSTANCES" != "None" ]; then
            echo "Encerrando instâncias EC2 residuais: $INSTANCES"
            aws ec2 terminate-instances --instance-ids $INSTANCES 2>/dev/null || true
            aws ec2 wait instance-terminated --instance-ids $INSTANCES 2>/dev/null || true
          fi

          # 2. Deletar Load Balancer órfão
          ALB_ARNS=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?contains(LoadBalancerName, 'lumina')].LoadBalancerArn" --output text 2>/dev/null || true)
          for A in $ALB_ARNS; do
            if [ -n "$A" ] && [ "$A" != "None" ]; then
              echo "Deletando ALB residual: $A..."
              aws elbv2 delete-load-balancer --load-balancer-arn "$A" 2>/dev/null || true
            fi
          done

          # 3. Deletar Target Groups órfãos
          TG_ARNS=$(aws elbv2 describe-target-groups --query "TargetGroups[?contains(TargetGroupName, 'lumina')].TargetGroupArn" --output text 2>/dev/null || true)
          for T in $TG_ARNS; do
            if [ -n "$T" ] && [ "$T" != "None" ]; then
              echo "Deletando Target Group residual: $T..."
              aws elbv2 delete-target-group --target-group-arn "$T" 2>/dev/null || true
            fi
          done

          # 4. Deletar KeyPair órfão
          if aws ec2 describe-key-pairs --key-names lumina-deploy-key >/dev/null 2>&1; then
            echo "Deletando KeyPair lumina-deploy-key..."
            aws ec2 delete-key-pair --key-name lumina-deploy-key 2>/dev/null || true
          fi

          # 5. Deletar Lambda Alexa residual
          if aws lambda get-function --function-name lumina-alexa-skill-dev >/dev/null 2>&1; then
            echo "Deletando Lambda lumina-alexa-skill-dev..."
            aws lambda delete-function --function-name lumina-alexa-skill-dev 2>/dev/null || true
          fi

          # 6. Deletar stacks CloudFormation de S3 residuais
          CF_STACKS=$(aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE DELETE_FAILED --query "StackSummaries[?starts_with(StackName, 'cf-s3-lumina')].StackName" --output text 2>/dev/null || true)
          for S in $CF_STACKS; do
            if [ -n "$S" ] && [ "$S" != "None" ]; then
              echo "Deletando stack CloudFormation S3: $S..."
              aws cloudformation delete-stack --stack-name "$S" 2>/dev/null || true
            fi
          done

      - name: Diagnostico de Falhas CloudFormation
        if: failure()
        run: |
          echo "=== Diagnosticando Stacks CloudFormation em Falha ==="
          FAILED_STACKS=$(aws cloudformation list-stacks --stack-status-filter CREATE_FAILED ROLLBACK_IN_PROGRESS ROLLBACK_FAILED ROLLBACK_COMPLETE --query "StackSummaries[].StackName" --output text 2>/dev/null || true)
          if [ -n "$FAILED_STACKS" ] && [ "$FAILED_STACKS" != "None" ]; then
            for STACK in $FAILED_STACKS; do
              echo "--------------------------------------------------------"
              echo "Eventos de erro da stack: $STACK"
              echo "--------------------------------------------------------"
              aws cloudformation describe-stack-events --stack-name "$STACK" --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].[LogicalResourceId, ResourceStatusReason]" --output table || true
            done
          fi

      - name: Persistir Terraform State (Branch terraform-states)
        if: always()
        run: |
          CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          if [ -f "./environments/${{ inputs.environment }}/terraform.tfstate" ]; then
            echo "Persistindo estado atualizado de ${{ inputs.environment }} (Conta: $CURRENT_ACCOUNT) na branch terraform-states..."
            rm -rf /tmp/tfstate-repo
            git clone --depth 1 -b terraform-states https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/tfstate-repo 2>/dev/null || {
              mkdir -p /tmp/tfstate-repo
              cd /tmp/tfstate-repo
              git init
              git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git checkout -b terraform-states
            }
            cd /tmp/tfstate-repo
            
            # Salva na pasta da conta do usuário para isolamento multi-aluno
            if [ -n "$CURRENT_ACCOUNT" ]; then
              mkdir -p "environments/${{ inputs.environment }}/${CURRENT_ACCOUNT}"
              cp $GITHUB_WORKSPACE/environments/${{ inputs.environment }}/terraform.tfstate* "environments/${{ inputs.environment }}/${CURRENT_ACCOUNT}/"
            fi

            # Salva na raiz para manter compatibilidade
            mkdir -p "environments/${{ inputs.environment }}"
            cp $GITHUB_WORKSPACE/environments/${{ inputs.environment }}/terraform.tfstate* "environments/${{ inputs.environment }}/"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add environments/${{ inputs.environment }}/
            git commit -m "chore(terraform): atualiza state de ${{ inputs.environment }} [conta: ${CURRENT_ACCOUNT:-desconhecida}] [skip ci]" || echo "Nenhuma alteracao no state."
            git pull --rebase origin terraform-states 2>/dev/null || true
            git push origin terraform-states || git push -u origin terraform-states --force || echo "Aviso: Nao foi possivel persistir via git push."
          fi

      - name: Salvar State como Artefato do Workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-${{ inputs.environment }}
          path: ./environments/${{ inputs.environment }}/terraform.tfstate*
          retention-days: 7
