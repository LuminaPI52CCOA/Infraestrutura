name: "Terraform Infrastructure Deploy/Destroy"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acao Terraform a ser executada"
        required: true
        type: choice
        options:
          - "apply"
          - "destroy"
      environment:
        description: "Perfil de Ambiente"
        required: true
        type: choice
        options:
          - "dev"
          - "prod"
      reset_state:
        description: "Descartar state previo e recriar do zero (util se trocou de conta AWS / Learner Lab)"
        required: false
        type: boolean
        default: false
      app_branch:
        description: "Branch das aplicacoes (Back-end, Front-End e Banco-de-dados)"
        required: true
        type: choice
        default: "develop"
        options:
          - "develop"
          - "main"
      aws_access_key_id:
        description: "AWS Access Key ID (Sessao temporaria do Learner Lab)"
        required: true
        type: string
      aws_secret_access_key:
        description: "AWS Secret Access Key"
        required: true
        type: string
      aws_session_token:
        description: "AWS Session Token"
        required: true
        type: string

jobs:
  terraform:
    name: "Executar Terraform (${{ inputs.action }} em ${{ inputs.environment }})"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      TF_VAR_alexa_lwa_client_id: ${{ secrets.ALEXA_LWA_CLIENT_ID }}
      TF_VAR_alexa_lwa_client_secret: ${{ secrets.ALEXA_LWA_CLIENT_SECRET }}
    steps:
      - name: Checkout do Repositorio Infraestrutura
        uses: actions/checkout@v4

      - name: Checkout do Modulo Lambda-Alexa
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Lambda-Alexa'
          ref: 'main'
          path: 'Lambda-Alexa'

      - name: Checkout do Modulo Data-Pipeline
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Data-Pipeline'
          ref: 'main'
          path: 'Data-Pipeline'

      - name: Checkout do Repositorio Back-end
        if: ${{ inputs.action == 'apply' }}
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Back-end'
          ref: ${{ inputs.app_branch }}
          path: 'Back-end'

      - name: Checkout do Repositorio Front-End
        if: ${{ inputs.action == 'apply' }}
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Front-End'
          ref: ${{ inputs.app_branch }}
          path: 'Front-End'

      - name: Checkout do Repositorio Banco-de-dados
        id: checkout-db
        if: ${{ inputs.action == 'apply' }}
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Banco-de-dados'
          ref: ${{ inputs.app_branch }}
          path: 'Banco-de-dados'
        continue-on-error: true

      - name: Fallback Checkout Banco-de-dados (se a branch selecionada nao existir no banco)
        if: ${{ inputs.action == 'apply' && steps.checkout-db.outcome != 'success' }}
        uses: actions/checkout@v4
        with:
          repository: 'LuminaPI52CCOA/Banco-de-dados'
          ref: 'main'
          path: 'Banco-de-dados'

      - name: Configurar Node.js para Lambda-Alexa
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias do Lambda-Alexa (node_modules)
        working-directory: Lambda-Alexa
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Configurar Java 21 para compilação do Back-end
        if: ${{ inputs.action == 'apply' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configurar estrutura de pastas multi-repo
        run: |
          mkdir -p ../../../Lambda-Alexa
          cp -r Lambda-Alexa/* ../../../Lambda-Alexa/ 2>/dev/null || true
          mkdir -p ../../Lambda-Alexa
          cp -r Lambda-Alexa/* ../../Lambda-Alexa/ 2>/dev/null || true
          mkdir -p ../Lambda-Alexa
          cp -r Lambda-Alexa/* ../Lambda-Alexa/ 2>/dev/null || true
          mkdir -p ../../../Data-Pipeline
          cp -r Data-Pipeline/* ../../../Data-Pipeline/ 2>/dev/null || true
          mkdir -p ../../Data-Pipeline
          cp -r Data-Pipeline/* ../../Data-Pipeline/ 2>/dev/null || true
          mkdir -p ../Data-Pipeline
          cp -r Data-Pipeline/* ../Data-Pipeline/ 2>/dev/null || true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Autenticar na AWS (Credenciais Efemeras do Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: "us-east-1"

      - name: Restaurar Terraform State (Persistência entre Execuções)
        run: |
          if [ "${{ inputs.reset_state }}" = "true" ]; then
            echo "Opcao reset_state ativada. Ignorando e descartando state previo para ${{ inputs.environment }}."
            rm -f ./environments/${{ inputs.environment }}/terraform.tfstate*
            exit 0
          fi

          mkdir -p /tmp/tfstate-repo
          git clone --depth 1 -b terraform-states https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/tfstate-repo 2>/dev/null || true
          
          STATE_FILE="/tmp/tfstate-repo/environments/${{ inputs.environment }}/terraform.tfstate"
          if [ -f "$STATE_FILE" ]; then
            CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
            STATE_ACCOUNTS=$(grep -o -E 'arn:aws:[^:]+:[^:]+:([0-9]{12})' "$STATE_FILE" 2>/dev/null | awk -F: '{print $5}' | sort -u | grep -v '^$' || true)

            if [ -n "$CURRENT_ACCOUNT" ] && [ -n "$STATE_ACCOUNTS" ]; then
              for ACC in $STATE_ACCOUNTS; do
                if [ "$ACC" != "$CURRENT_ACCOUNT" ]; then
                  echo "::warning:: Conflito de conta detectado! O state anterior pertence a conta $ACC, mas as credenciais atuais sao da conta $CURRENT_ACCOUNT. Descartando state anterior para evitar conflito de ARNs no Learner Lab."
                  rm -f ./environments/${{ inputs.environment }}/terraform.tfstate*
                  exit 0
                fi
              done
            fi

            echo "Encontrado estado anterior para ${{ inputs.environment }}. Restaurando..."
            cp /tmp/tfstate-repo/environments/${{ inputs.environment }}/terraform.tfstate* ./environments/${{ inputs.environment }}/
          else
            echo "Nenhum arquivo terraform.tfstate previo encontrado para ${{ inputs.environment }}."
          fi

      - name: Terraform Init
        working-directory: ./environments/${{ inputs.environment }}
        run: terraform init

      - name: Limpar Stacks CloudFormation com Falha Prévia (ROLLBACK_COMPLETE)
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Verificando se existem stacks CloudFormation em ROLLBACK_COMPLETE..."
          FAILED_STACKS=$(aws cloudformation list-stacks --stack-status-filter ROLLBACK_COMPLETE --query "StackSummaries[].StackName" --output text 2>/dev/null || true)
          if [ -n "$FAILED_STACKS" ] && [ "$FAILED_STACKS" != "None" ]; then
            for STACK in $FAILED_STACKS; do
              echo "Deletando stack morta $STACK para permitir recriação limpa pelo Terraform..."
              aws cloudformation delete-stack --stack-name "$STACK"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK" 2>/dev/null || true
            done
          else
            echo "Nenhuma stack em ROLLBACK_COMPLETE encontrada."
          fi

      - name: Fase 1 - Terraform Apply ECR (Criação dos Repositórios ECR)
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./environments/${{ inputs.environment }}
        run: terraform apply -target=module.ecr -auto-approve

      - name: Autenticar no Amazon ECR
        if: ${{ inputs.action == 'apply' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fase 2 - Build e Push da Imagem Backend para o ECR
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Compilando backend Spring Boot (Maven)..."
          cd Back-end
          mvn clean package -DskipTests
          echo "Construindo imagem Docker backend..."
          docker build -t ${{ steps.login-ecr.outputs.registry }}/lumina-backend:latest .
          echo "Enviando imagem backend ao ECR..."
          docker push ${{ steps.login-ecr.outputs.registry }}/lumina-backend:latest
          cd ..

      - name: Fase 2 - Build e Push da Imagem Frontend para o ECR
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Compilando frontend React/Vite..."
          cd Front-End
          npm ci
          npm run build
          echo "Construindo imagem Docker frontend..."
          docker build -t ${{ steps.login-ecr.outputs.registry }}/lumina-frontend:latest .
          echo "Enviando imagem frontend ao ECR..."
          docker push ${{ steps.login-ecr.outputs.registry }}/lumina-frontend:latest
          cd ..

      - name: Fase 2 - Build e Push da Imagem Banco-de-dados para o ECR
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Construindo imagem Docker database..."
          cd Banco-de-dados
          docker build -t ${{ steps.login-ecr.outputs.registry }}/lumina-database:latest .
          echo "Enviando imagem database ao ECR..."
          docker push ${{ steps.login-ecr.outputs.registry }}/lumina-database:latest
          cd ..

      - name: Fase 3 - Terraform Apply Completo (EC2s, ALBs, Storage e Telecom)
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./environments/${{ inputs.environment }}
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ./environments/${{ inputs.environment }}
        run: terraform destroy -auto-approve

      - name: Diagnostico de Falhas CloudFormation
        if: failure()
        run: |
          echo "=== Diagnosticando Stacks CloudFormation em Falha ==="
          FAILED_STACKS=$(aws cloudformation list-stacks --stack-status-filter CREATE_FAILED ROLLBACK_IN_PROGRESS ROLLBACK_FAILED ROLLBACK_COMPLETE --query "StackSummaries[].StackName" --output text 2>/dev/null || true)
          if [ -n "$FAILED_STACKS" ] && [ "$FAILED_STACKS" != "None" ]; then
            for STACK in $FAILED_STACKS; do
              echo "--------------------------------------------------------"
              echo "Eventos de erro da stack: $STACK"
              echo "--------------------------------------------------------"
              aws cloudformation describe-stack-events --stack-name "$STACK" --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].[LogicalResourceId, ResourceStatusReason]" --output table || true
            done
          fi

      - name: Persistir Terraform State (Branch terraform-states)
        if: always()
        run: |
          if [ -f "./environments/${{ inputs.environment }}/terraform.tfstate" ]; then
            echo "Persistindo estado atualizado de ${{ inputs.environment }} na branch terraform-states..."
            mkdir -p /tmp/tfstate-repo
            cd /tmp/tfstate-repo
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git checkout -b terraform-states
            fi
            mkdir -p environments/${{ inputs.environment }}
            cp $GITHUB_WORKSPACE/environments/${{ inputs.environment }}/terraform.tfstate* environments/${{ inputs.environment }}/
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(terraform): atualiza state de ${{ inputs.environment }} [skip ci]" || echo "Nenhuma alteracao no state."
            git push -u origin terraform-states --force || echo "Aviso: Nao foi possivel persistir via git push."
          fi

      - name: Salvar State como Artefato do Workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-${{ inputs.environment }}
          path: ./environments/${{ inputs.environment }}/terraform.tfstate*
          retention-days: 7
